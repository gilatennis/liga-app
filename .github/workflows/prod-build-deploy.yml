name: Prod - Build and Deploy

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: kevinjanada/gilatennis.liga-app
  DOCKER_TAG: prod
  DOCKER_CONTAINER_NAME: gilatennis.liga-app
  VAULT_URL: https://vault.gilatennis.com
  ENV: production

jobs:

  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE_NAME }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
        labels: ${{ steps.meta.outputs.labels }}

  # ssh to dev server pull new image and run container
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Import Secrets
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_URL }}
          tlsSkipVerify: true
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            rest-api/prod/data/db DB_NAME | DB_NAME ;
            rest-api/prod/data/db DB_HOST | DB_HOST ;
            rest-api/prod/data/db DB_PASSWORD | DB_PASSWORD ;
            rest-api/prod/data/db DB_PORT | DB_PORT ;
            rest-api/prod/data/db DB_USER | DB_USER ;
            rest-api/prod/data/jwt JWT_SECRET | JWT_SECRET ;
            rest-api/prod/data/mailtrap MAILTRAP_TOKEN | MAILTRAP_TOKEN ;
            rest-api/prod/data/minio MINIO_ACCESS_KEY | MINIO_ACCESS_KEY ;
            rest-api/prod/data/minio MINIO_SECRET_KEY | MINIO_SECRET_KEY ;
            rest-api/prod/data/duitku DUITKU_API_KEY | DUITKU_API_KEY ;
            rest-api/prod/data/redis REDIS_PASSWORD | REDIS_PASSWORD ;
            rest-api/prod/data/redis REDIS_SECRET | REDIS_SECRET ;

      - name: Pull image and run @ VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST_PROD }}
          username: kevin
          key: ${{ secrets.HOST_ID_RSA_PROD }}
          envs: ENV,DOCKER_IMAGE_NAME,DOCKER_TAG,DOCKER_CONTAINER_NAME,GITHUB_SHA
          script: |
            # make sure redis is running
            # docker run --name redis -d -p 6379:6379/tcp redis redis-server --save 60 1 --loglevel warning --requirepass password
            # Stop running container
            docker stop $(echo $DOCKER_CONTAINER_NAME)
            # Remove old container
            docker rm $(echo $DOCKER_CONTAINER_NAME)
            # Remove old image
            docker image rm $(echo $DOCKER_IMAGE_NAME:$DOCKER_TAG)
            # Pull new image
            docker pull $(echo $DOCKER_IMAGE_NAME:$DOCKER_TAG)
            # Run a new container from a new image
            # -p 8080:8080/tcp \
            docker run -d \
            --network host \
            -e ENV=$(echo $ENV) \
            -e VAULT_URL=${{ env.VAULT_URL }} \
            -e VAULT_TOKEN=${{ secrets.VAULT_TOKEN }} \
            --restart always \
            --name $(echo $DOCKER_CONTAINER_NAME) \
            $(echo $DOCKER_IMAGE_NAME:$DOCKER_TAG)



